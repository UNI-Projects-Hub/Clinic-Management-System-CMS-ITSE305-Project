name: Java CI – Compile and Run on Pull Request

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1) Get the code from the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) Install Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3) Compile all Java source files
      - name: Compile Java sources
        run: |
          mkdir -p bin
          # Find all .java files under src and compile them into bin/
          find src -name "*.java" > sources.txt
          if [ -s sources.txt ]; then
            javac -d bin @sources.txt
          else
            echo "No Java source files found to compile."
          fi

      # 4) Run a small smoke test (our HelloCI class)
      - name: Run HelloCI main
        run: |
          cd bin
          java com.clinic.helloci.HelloCI

